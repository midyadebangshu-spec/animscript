[package]
name = "animscript-math"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The mathematical IR: expressions of x, y, t, ... compiled to a deterministic, batched evaluator"
build = "build.rs"

[features]
# compile the vendored ExprTk and run the differential tests against it (slow to build; tests only)
exprtk = []
# a Cranelift JIT whose results are bit-identical to the interpreter's (see docs/DECISIONS.md)
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]

[dependencies]
cranelift-codegen = { version = "=0.137.1", optional = true }
cranelift-frontend = { version = "=0.137.1", optional = true }
cranelift-jit = { version = "=0.137.1", optional = true }
cranelift-module = { version = "=0.137.1", optional = true }
cranelift-native = { version = "=0.137.1", optional = true }
# the maths library in pure Rust: sin, exp, pow, ... give the same bits on every platform
libm = "0.2"

[build-dependencies]
cc = "1"
