[workspace]
resolver = "2"
members = ["crates/core", "crates/lang", "crates/render", "crates/anim", "crates/physics", "crates/physics3", "crates/brush", "crates/math", "crates/audio", "crates/editor"]
# the editor pulls in a GUI stack: `cargo build` / `cargo test` leave it out (use `-p anim-editor`)
default-members = ["crates/core", "crates/lang", "crates/render", "crates/anim", "crates/physics", "crates/physics3", "crates/brush", "crates/math", "crates/audio"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
animscript-core = { path = "crates/core" }
animscript-lang = { path = "crates/lang" }
animscript-render = { path = "crates/render" }
animscript-physics = { path = "crates/physics" }
animscript-physics3 = { path = "crates/physics3" }
animscript-brush = { path = "crates/brush" }
animscript-math = { path = "crates/math" }
animscript-audio = { path = "crates/audio" }
serde_json = "1"
tiny-skia = "0.11"
clap = { version = "4", features = ["derive"] }
png = "0.18"

# the physics engines are numeric inner loops: optimise them even in debug builds so their tests run quickly
[profile.dev.package.animscript-physics3]
opt-level = 3
